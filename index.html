    <script>
      // Netlify Drawer blocker for clean mobile UI
      const hideNetlifyDrawer = () => {
        const el = document.getElementById('netlify-drawer-root') || document.querySelector('.netlify-drawer-root') || document.querySelector('[data-netlify-drawer]');
        if (el) el.remove();
      };
      if (typeof window !== 'undefined') {
        const obs = new MutationObserver(hideNetlifyDrawer);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', hideNetlifyDrawer);
      }
    </script>

  </head>

  </body>
