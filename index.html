    <!-- Open Graph / WhatsApp / Facebook -->

    <meta property="og:site_name" content="Teman TJR" />

    <!-- Twitter / Telegram -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://teman-tjr.netlify.app/" />
    <meta name="twitter:title" content="Teman TJR - Teman Jalan Dalam Genggaman" />

    <meta name="twitter:image" content="https://teman-tjr.netlify.app/og-banner.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      #netlify-drawer-root,
      .netlify-drawer-root,
      [data-netlify-drawer],
      iframe[id^="nl-"],
      iframe[title*="Netlify" i],
      iframe[title*="Powered by Netlify" i] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>

    <script>
      // Apply saved theme & font size immediately before paint (prevents flash)
      try {
        var savedTheme = localStorage.getItem('tjr_theme_mode');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var savedFont = localStorage.getItem('tjr_font_size');
        if (savedFont === 'sm' || savedFont === 'lg' || savedFont === 'md') {
          document.documentElement.setAttribute('data-font-size', savedFont);
        }
      } catch (e) {}

      // Netlify HUD & Drawer Blocker
      const killNetlifyHUD = () => {
        const targets = [
          '#nl-badge-frame',
          '#nl-hud-frame',
          '#netlify-drawer-root',
          '.netlify-drawer-root',
          '[data-netlify-drawer]',
          'iframe[id^="nl-"]',
          'iframe[title*="Netlify" i]',
          'script[src*=".netlify/scripts/hud"]'
        ];
        targets.forEach((sel) => {
          document.querySelectorAll(sel).forEach((el) => {
            // Keep the inert dummy tags that prevent HUD script re-running
            if (el.tagName !== 'DIV') {
              el.remove();
            }
          });
        });
      };
      if (typeof window !== 'undefined') {
        const obs = new MutationObserver(killNetlifyHUD);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', killNetlifyHUD);
        document.addEventListener('DOMContentLoaded', killNetlifyHUD);
      }
    </script>

  </head>
  <body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen">
    <!-- Dummy elements to trigger Netlify HUD script early exit -->
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;position:absolute!important;left:-9999px!important;"></div>
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;position:absolute!important;left:-9999px!important;"></div>

    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
